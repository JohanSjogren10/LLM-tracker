name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # The model checker pushes with GITHUB_TOKEN, which never triggers a `push`
  # event. Deploy explicitly once the checker has finished so the published
  # site always reflects the latest data/models.json.
  workflow_run:
    workflows: ["Check for New LLM Models"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
